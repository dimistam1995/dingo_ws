# Clearpath DD100 twist_mux overlay used by the Dashboard autonomous gate.
# Install the matching bt_quality block in
# /etc/clearpath/platform/config/twist_mux.yaml before restarting the
# clearpath-platform.service.  The physical E-stop and safety-stop locks are
# deliberately unchanged.
dd100_10000002:
  twist_mux:
    ros__parameters:
      use_stamped: True
      topics:
        joy:
          topic: 'joy_teleop/cmd_vel'
          timeout: 0.5
          priority: 10
        interactive_marker:
          topic: 'twist_marker_server/cmd_vel'
          timeout: 0.5
          priority: 8
        rc:
          topic: 'rc_teleop/cmd_vel'
          timeout: 0.5
          priority: 12
        external:
          topic: 'cmd_vel'
          timeout: 0.5
          priority: 1
      locks:
        e_stop:
          topic: 'platform/emergency_stop'
          timeout: 0.0
          priority: 255
        safety_stop:
          topic: 'platform/safety_stop'
          timeout: 0.0
          priority: 254
        bt_quality:
          topic: 'joy_teleop/bt_quality_stop_gate'
          timeout: 0.5
          priority: 253
